<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Journey to Fertilization</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        overflow: hidden;
        background:
            radial-gradient(circle at center, #3a124c 0%, #1c092b 55%, #07020f 100%);
        font-family: Arial, Helvetica, sans-serif;
        color: white;
    }

    canvas {
        display: block;
        width: 100vw;
        height: 100vh;
    }

    #title {
        position: absolute;
        top: 18px;
        left: 50%;
        transform: translateX(-50%);
        text-align: center;
        z-index: 10;

        font-size: clamp(24px, 3vw, 42px);
        font-weight: bold;

        text-shadow:
            0 0 10px #ff5ecf,
            0 0 24px #b95cff;
    }

    #subtitle {
        margin-top: 5px;
        font-size: 14px;
        color: #efd6ff;
        font-weight: normal;
    }

    #stage {
        position: absolute;
        left: 50%;
        bottom: 65px;
        transform: translateX(-50%);

        max-width: 85%;
        padding: 12px 24px;

        background: rgba(15, 0, 30, 0.75);
        border: 1px solid rgba(255,255,255,.35);
        border-radius: 24px;

        backdrop-filter: blur(8px);

        font-size: 17px;
        text-align: center;

        box-shadow:
            0 0 18px rgba(255,60,200,.35);
    }

    #controls {
        position: absolute;
        bottom: 15px;
        left: 50%;
        transform: translateX(-50%);

        display: flex;
        gap: 10px;
    }

    button {
        border: none;
        border-radius: 18px;
        padding: 9px 18px;

        background: linear-gradient(90deg, #ff4fc8, #895bff);
        color: white;

        font-weight: bold;
        cursor: pointer;

        box-shadow:
            0 0 12px rgba(255,80,220,.45);
    }

    button:hover {
        transform: scale(1.05);
    }

    #legend {
        position: absolute;
        right: 18px;
        top: 95px;

        background: rgba(10,0,25,.65);
        padding: 12px 15px;
        border-radius: 12px;

        border: 1px solid rgba(255,255,255,.18);

        font-size: 13px;
        line-height: 1.6;
    }

    .dot {
        display: inline-block;
        width: 9px;
        height: 9px;
        border-radius: 50%;
        margin-right: 7px;
    }

    .pink {
        background: #ff80cc;
    }

    .blue {
        background: #65e8ff;
    }

    .yellow {
        background: #ffe27a;
    }
</style>
</head>

<body>

<div id="title">
    Journey to Fertilization
    <div id="subtitle">
        Simplified educational animation of human fertilization
    </div>
</div>

<div id="legend">
    <div><span class="dot pink"></span>Reproductive tract</div>
    <div><span class="dot blue"></span>Spermatozoa</div>
    <div><span class="dot yellow"></span>Egg / Ovum</div>
</div>

<div id="stage">
    Spermatozoa enter the reproductive tract
</div>

<div id="controls">
    <button onclick="restartAnimation()">Restart</button>
    <button onclick="togglePause()">Pause / Resume</button>
</div>

<canvas id="canvas"></canvas>

<script>

/* =====================================================
   CANVAS SETUP
===================================================== */

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let width;
let height;

function resizeCanvas() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
}

window.addEventListener("resize", resizeCanvas);
resizeCanvas();


/* =====================================================
   GLOBAL ANIMATION VARIABLES
===================================================== */

let animationTime = 0;
let paused = false;
let fertilized = false;

let flash = 0;

const stageText = document.getElementById("stage");

let spermCells = [];
let particles = [];


/* =====================================================
   PATH THROUGH REPRODUCTIVE TRACT

   x and y are normalized values,
   so the animation scales to the screen.
===================================================== */

const pathway = [

    // Vaginal canal
    {x: 0.05, y: 0.78},
    {x: 0.10, y: 0.72},
    {x: 0.16, y: 0.66},
    {x: 0.22, y: 0.61},

    // Cervix
    {x: 0.28, y: 0.56},
    {x: 0.34, y: 0.52},

    // Uterus
    {x: 0.42, y: 0.49},
    {x: 0.50, y: 0.46},
    {x: 0.58, y: 0.43},

    // Fallopian tube
    {x: 0.64, y: 0.38},
    {x: 0.70, y: 0.32},
    {x: 0.77, y: 0.29},
    {x: 0.84, y: 0.31},

    // Egg
    {x: 0.89, y: 0.35}
];


/* =====================================================
   HELPER FUNCTION
===================================================== */

function pointOnPath(progress) {

    progress = Math.max(0, Math.min(1, progress));

    const scaled = progress * (pathway.length - 1);

    const index = Math.floor(scaled);

    const nextIndex = Math.min(index + 1, pathway.length - 1);

    const localProgress = scaled - index;

    const p1 = pathway[index];
    const p2 = pathway[nextIndex];

    return {
        x:
            (p1.x + (p2.x - p1.x) * localProgress) * width,

        y:
            (p1.y + (p2.y - p1.y) * localProgress) * height
    };
}


/* =====================================================
   DRAW REPRODUCTIVE SYSTEM
===================================================== */

function drawAnatomy() {

    ctx.save();

    /* -----------------------------------------
       Vaginal canal
    ------------------------------------------ */

    ctx.lineCap = "round";

    ctx.beginPath();

    ctx.moveTo(width * 0.04, height * 0.79);

    ctx.bezierCurveTo(
        width * 0.13, height * 0.72,
        width * 0.19, height * 0.64,
        width * 0.28, height * 0.56
    );

    ctx.strokeStyle = "rgba(255,100,180,.28)";
    ctx.lineWidth = 75;
    ctx.stroke();

    ctx.strokeStyle = "rgba(255,155,205,.55)";
    ctx.lineWidth = 4;
    ctx.stroke();


    /* -----------------------------------------
       Cervix
    ------------------------------------------ */

    ctx.beginPath();

    ctx.ellipse(
        width * 0.31,
        height * 0.54,
        35,
        24,
        -0.4,
        0,
        Math.PI * 2
    );

    ctx.fillStyle = "rgba(255,105,180,.55)";
    ctx.fill();


    /* Cervical opening */

    ctx.beginPath();

    ctx.arc(
        width * 0.32,
        height * 0.535,
        7,
        0,
        Math.PI * 2
    );

    ctx.fillStyle = "rgba(100,20,75,.8)";
    ctx.fill();


    /* -----------------------------------------
       Uterus
    ------------------------------------------ */

    ctx.beginPath();

    ctx.moveTo(width * 0.34, height * 0.52);

    ctx.bezierCurveTo(
        width * 0.37, height * 0.34,
        width * 0.56, height * 0.30,
        width * 0.62, height * 0.43
    );

    ctx.bezierCurveTo(
        width * 0.60, height * 0.60,
        width * 0.42, height * 0.64,
        width * 0.34, height * 0.52
    );

    let uterusGradient =
        ctx.createRadialGradient(
            width * .48,
            height * .45,
            20,

            width * .48,
            height * .45,
            width * .16
        );

    uterusGradient.addColorStop(0, "rgba(255,110,195,.45)");
    uterusGradient.addColorStop(1, "rgba(140,30,110,.35)");

    ctx.fillStyle = uterusGradient;
    ctx.fill();

    ctx.strokeStyle = "rgba(255,150,215,.75)";
    ctx.lineWidth = 4;
    ctx.stroke();


    /* -----------------------------------------
       Fallopian tube
    ------------------------------------------ */

    ctx.beginPath();

    ctx.moveTo(width * 0.59, height * 0.40);

    ctx.bezierCurveTo(
        width * 0.67, height * 0.26,
        width * 0.78, height * 0.23,
        width * 0.86, height * 0.32
    );

    ctx.strokeStyle = "rgba(255,110,190,.35)";
    ctx.lineWidth = 38;
    ctx.stroke();

    ctx.strokeStyle = "rgba(255,155,210,.65)";
    ctx.lineWidth = 3;
    ctx.stroke();


    /* Tube fimbriae */

    for (let i = 0; i < 6; i++) {

        const baseX = width * 0.855;
        const baseY = height * 0.32;

        const angle =
            -0.9 +
            i * 0.3;

        ctx.beginPath();

        ctx.moveTo(baseX, baseY);

        ctx.quadraticCurveTo(
            baseX + Math.cos(angle) * 30,
            baseY + Math.sin(angle) * 30,

            baseX + Math.cos(angle) * 55,
            baseY + Math.sin(angle) * 55
        );

        ctx.strokeStyle = "rgba(255,150,210,.75)";
        ctx.lineWidth = 5;
        ctx.stroke();
    }


    /* -----------------------------------------
       Anatomical labels
    ------------------------------------------ */

    ctx.font = "bold 15px Arial";
    ctx.textAlign = "center";

    drawLabel(
        "Vagina",
        width * .16,
        height * .79
    );

    drawLabel(
        "Cervix",
        width * .31,
        height * .61
    );

    drawLabel(
        "Uterus",
        width * .48,
        height * .56
    );

    drawLabel(
        "Fallopian Tube",
        width * .71,
        height * .20
    );

    ctx.restore();
}


function drawLabel(text, x, y) {

    ctx.fillStyle = "rgba(255,255,255,.9)";

    ctx.fillText(text, x, y);

}


/* =====================================================
   EGG
===================================================== */

const egg = {
    x: 0,
    y: 0,
    radius: 55,
    pulse: 0
};


function drawEgg() {

    egg.x = width * 0.89;
    egg.y = height * 0.35;

    egg.radius =
        Math.max(
            40,
            Math.min(width, height) * .055
        );

    egg.pulse += .04;

    const pulse =
        Math.sin(egg.pulse) * 4;


    /* Glow */

    const glow =
        ctx.createRadialGradient(
            egg.x,
            egg.y,
            egg.radius * .3,

            egg.x,
            egg.y,
            egg.radius * 1.8
        );

    glow.addColorStop(
        0,
        "rgba(255,245,155,.65)"
    );

    glow.addColorStop(
        1,
        "rgba(255,200,80,0)"
    );

    ctx.beginPath();

    ctx.arc(
        egg.x,
        egg.y,
        egg.radius * 1.8 + pulse,
        0,
        Math.PI * 2
    );

    ctx.fillStyle = glow;
    ctx.fill();


    /* Zona pellucida */

    ctx.beginPath();

    ctx.arc(
        egg.x,
        egg.y,
        egg.radius + 8,
        0,
        Math.PI * 2
    );

    ctx.fillStyle =
        "rgba(255,210,100,.35)";

    ctx.fill();


    /* Egg */

    const gradient =
        ctx.createRadialGradient(
            egg.x - egg.radius * .3,
            egg.y - egg.radius * .3,
            5,

            egg.x,
            egg.y,
            egg.radius
        );

    gradient.addColorStop(0, "#fff8c5");
    gradient.addColorStop(.4, "#ffc45e");
    gradient.addColorStop(1, "#d46b32");

    ctx.beginPath();

    ctx.arc(
        egg.x,
        egg.y,
        egg.radius,
        0,
        Math.PI * 2
    );

    ctx.fillStyle = gradient;
    ctx.fill();


    /* Nucleus */

    ctx.beginPath();

    ctx.arc(
        egg.x,
        egg.y,
        egg.radius * .25,
        0,
        Math.PI * 2
    );

    ctx.fillStyle =
        fertilized
            ? "#fff4a8"
            : "rgba(150,70,70,.45)";

    ctx.fill();


    drawLabel(
        fertilized
            ? "Fertilized Egg"
            : "Egg / Ovum",

        egg.x,
        egg.y - egg.radius - 18
    );

}


/* =====================================================
   SPERM CLASS
===================================================== */

class Sperm {

    constructor(index) {

        this.index = index;

        this.winner =
            index === 0;

        this.reset();

    }


    reset() {

        this.progress =
            Math.random() * .06;

        this.speed =
            .0007 +
            Math.random() * .00055;

        this.waveOffset =
            Math.random() * Math.PI * 2;

        this.waveStrength =
            3 +
            Math.random() * 7;

        this.size =
            4 +
            Math.random() * 2;

        this.finished = false;

    }


    update() {

        if (fertilized && this.winner)
            return;


        /* Winner moves slightly faster */

        if (this.winner) {

            if (animationTime > 140)
                this.progress += .0010;

        }

        else {

            this.progress += this.speed;

        }


        /* Keep ordinary sperm from reaching egg */

        if (!this.winner &&
            this.progress > .94) {

            this.progress = .94;
        }


        if (this.winner &&
            this.progress >= .995 &&
            !fertilized) {

            this.finished = true;

            startFertilization();
        }

    }


    draw() {

        if (
            this.finished &&
            fertilized
        )
            return;


        const pos =
            pointOnPath(
                Math.min(
                    this.progress,
                    .995
                )
            );


        const ahead =
            pointOnPath(
                Math.min(
                    this.progress + .004,
                    1
                )
            );


        const angle =
            Math.atan2(
                ahead.y - pos.y,
                ahead.x - pos.x
            );


        const wave =
            Math.sin(
                animationTime * .12 +
                this.waveOffset
            ) * this.waveStrength;


        const normalX =
            Math.cos(
                angle + Math.PI / 2
            );

        const normalY =
            Math.sin(
                angle + Math.PI / 2
            );


        const x =
            pos.x +
            normalX * wave;

        const y =
            pos.y +
            normalY * wave;


        ctx.save();

        ctx.translate(x, y);

        ctx.rotate(angle);


        /* Tail */

        ctx.beginPath();

        ctx.moveTo(-4, 0);

        for (let i = 0; i < 32; i++) {

            const tx =
                -i * 1.7;

            const ty =
                Math.sin(
                    animationTime * .22 +
                    i * .48 +
                    this.waveOffset
                ) * 3;

            ctx.lineTo(tx, ty);
        }

        ctx.strokeStyle =
            "rgba(100,235,255,.8)";

        ctx.lineWidth = 1.7;

        ctx.stroke();


        /* Head glow */

        const glow =
            ctx.createRadialGradient(
                0,0,0,
                0,0,this.size * 3
            );

        glow.addColorStop(
            0,
            "rgba(180,250,255,.9)"
        );

        glow.addColorStop(
            1,
            "rgba(70,200,255,0)"
        );

        ctx.beginPath();

        ctx.arc(
            0,
            0,
            this.size * 3,
            0,
            Math.PI * 2
        );

        ctx.fillStyle = glow;

        ctx.fill();


        /* Sperm head */

        ctx.beginPath();

        ctx.ellipse(
            0,
            0,
            this.size * 1.5,
            this.size,
            0,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            this.winner
                ? "#c8ffff"
                : "#7be9ff";

        ctx.fill();

        ctx.restore();
    }

}


/* =====================================================
   CREATE SPERM CELLS
===================================================== */

function createSpermCells() {

    spermCells = [];

    for (let i = 0; i < 45; i++) {

        spermCells.push(
            new Sperm(i)
        );
    }
}

createSpermCells();


/* =====================================================
   BACKGROUND PARTICLES
===================================================== */

const backgroundParticles = [];

for (let i = 0; i < 80; i++) {

    backgroundParticles.push({
        x: Math.random(),
        y: Math.random(),
        radius: Math.random() * 3 + 1,
        speed: Math.random() * .2 + .05
    });

}


function drawBackgroundParticles() {

    backgroundParticles.forEach(p => {

        p.x += p.speed / width;

        if (p.x > 1)
            p.x = 0;

        ctx.beginPath();

        ctx.arc(
            p.x * width,
            p.y * height,
            p.radius,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            "rgba(255,180,255,.10)";

        ctx.fill();
    });

}


/* =====================================================
   FERTILIZATION PARTICLES
===================================================== */

function createFertilizationParticles() {

    for (let i = 0; i < 120; i++) {

        const angle =
            Math.random() *
            Math.PI * 2;

        const speed =
            Math.random() * 5 + 1;

        particles.push({

            x: egg.x,
            y: egg.y,

            dx:
                Math.cos(angle) *
                speed,

            dy:
                Math.sin(angle) *
                speed,

            life:
                80 +
                Math.random() * 50,

            size:
                1 +
                Math.random() * 4
        });
    }

}


function updateParticles() {

    particles.forEach(p => {

        p.x += p.dx;
        p.y += p.dy;

        p.dx *= .97;
        p.dy *= .97;

        p.life--;


        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            `rgba(
                255,
                240,
                130,
                ${Math.max(0,p.life/120)}
            )`;

        ctx.fill();
    });


    particles =
        particles.filter(
            p => p.life > 0
        );
}


/* =====================================================
   FERTILIZATION EVENT
===================================================== */

function startFertilization() {

    if (fertilized)
        return;

    fertilized = true;

    flash = 1;

    createFertilizationParticles();

    stageText.innerHTML =
        "Fertilization: one sperm cell fuses with the egg.";

}


/* =====================================================
   STAGE TEXT
===================================================== */

function updateStageText() {

    if (fertilized)
        return;


    const winnerProgress =
        spermCells[0].progress;


    if (winnerProgress < .20) {

        stageText.innerHTML =
            "Stage 1 — Spermatozoa enter and travel through the vaginal canal.";

    }

    else if (winnerProgress < .34) {

        stageText.innerHTML =
            "Stage 2 — Sperm cells approach and pass through the cervix.";

    }

    else if (winnerProgress < .60) {

        stageText.innerHTML =
            "Stage 3 — Spermatozoa travel through the uterus.";

    }

    else if (winnerProgress < .88) {

        stageText.innerHTML =
            "Stage 4 — Sperm enter the fallopian tube and continue toward the egg.";

    }

    else {

        stageText.innerHTML =
            "Stage 5 — Sperm cells surround the egg. One approaches the egg membrane.";

    }

}


/* =====================================================
   FLASH EFFECT
===================================================== */

function drawFlash() {

    if (flash <= 0)
        return;


    ctx.fillStyle =
        `rgba(
            255,
            245,
            175,
            ${flash * .30}
        )`;

    ctx.fillRect(
        0,
        0,
        width,
        height
    );

    flash -= .012;
}


/* =====================================================
   ANIMATION LOOP
===================================================== */

function animate() {

    requestAnimationFrame(
        animate
    );


    if (paused)
        return;


    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    drawBackgroundParticles();

    drawAnatomy();

    drawEgg();


    spermCells.forEach(
        sperm => {

            sperm.update();

            sperm.draw();

        }
    );


    updateParticles();

    drawFlash();

    updateStageText();

    animationTime++;
}


/* =====================================================
   CONTROLS
===================================================== */

function restartAnimation() {

    animationTime = 0;

    fertilized = false;

    flash = 0;

    particles = [];

    createSpermCells();

    stageText.innerHTML =
        "Spermatozoa enter the reproductive tract";
}


function togglePause() {

    paused = !paused;

}


/* =====================================================
   START
===================================================== */

animate();

</script>

</body>
</html>
